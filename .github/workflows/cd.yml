name: cd

on:
  workflow_run:
    workflows: ["ci"]
    branches: ["dev"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to workflow_run head SHA or latest)"
        required: false
        default: "latest"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCS_MODEL_BUCKET: ${{ secrets.GCS_MODEL_BUCKET }}
  SERVICE_NAME: offer-ranker-api
  ARTIFACT_REPO: offer-ranker-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Determine image to deploy
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="${{ github.event.workflow_run.head_sha }}"
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/offer-ranker-api:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - id: capture-prev
        name: Capture previous image (for rollback)
        run: |
          set +e
          PREV_IMAGE=$(gcloud run services describe "${SERVICE_NAME}" --region "${GCP_REGION}" --format="value(template.spec.containers[0].image)")
          set -e
          echo "previous_image=${PREV_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: api/infrastructure
        run: terraform init

      - name: Terraform apply
        working-directory: api/infrastructure
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          terraform apply -auto-approve \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="region=${GCP_REGION}" \
            -var="image=${IMAGE}" \
            -var="service_name=${SERVICE_NAME}" \
            -var="gcs_model_bucket=${GCS_MODEL_BUCKET}" \
            -var="service_account_email=ci-cd-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com"

      - id: tf-output
        name: Capture Terraform outputs
        working-directory: api/infrastructure
        run: |
          SERVICE_URL=$(terraform output -raw service_url)
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests
        id: smoke
        env:
          SERVICE_URL: ${{ steps.tf-output.outputs.service_url }}
        run: |
          echo "Hitting ${SERVICE_URL}"
          health_status=$(curl -s -o /tmp/health.json -w "%{http_code}" "${SERVICE_URL}/health")
          if [[ "${health_status}" != "200" ]]; then
            echo "Health check failed with status ${health_status}"
            cat /tmp/health.json
            exit 1
          fi
          payload='{"age":30,"tenure_months":24,"monthly_spend":120.5,"num_support_tickets":2}'
          predict_status=$(curl -s -o /tmp/predict.json -w "%{http_code}" -X POST "${SERVICE_URL}/predict" -H "Content-Type: application/json" -d "${payload}")
          if [[ "${predict_status}" != "200" ]]; then
            echo "Predict check failed with status ${predict_status}"
            cat /tmp/predict.json
            exit 1
          fi
          echo "Smoke tests passed."

      - name: Roll back on failure
        if: failure() && steps.capture-prev.outputs.previous_image != ''
        env:
          PREV_IMAGE: ${{ steps.capture-prev.outputs.previous_image }}
        run: |
          echo "Rolling back to previous image ${PREV_IMAGE}"
          gcloud run services update "${SERVICE_NAME}" --region "${GCP_REGION}" --image "${PREV_IMAGE}"

      - name: Publish deployment info
        if: success()
        env:
          SERVICE_URL: ${{ steps.tf-output.outputs.service_url }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "Deployed image: ${IMAGE}"
            echo "Service URL: ${SERVICE_URL}"
            echo
            echo "Sample commands:"
            echo "\\`curl -s ${SERVICE_URL}/health\\`"
            echo "curl -s -X POST ${SERVICE_URL}/predict -H 'Content-Type: application/json' -d '{\"age\":30,\"tenure_months\":24,\"monthly_spend\":120.5,\"num_support_tickets\":2}'"
          } >> "$GITHUB_STEP_SUMMARY"
