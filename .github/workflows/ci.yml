name: ci

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  ARTIFACT_REPO: offer-ranker-api
  SERVICE_NAME: offer-ranker-api

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          # Install training deps if present; otherwise ensure dq deps exist
          if [ -f training/requirements.txt ]; then
            pip install -r training/requirements.txt
          else
            pip install pandas pyyaml
          fi
          pip install pip-audit==2.7.3

      - name: Run pytest
        run: .venv/bin/pytest api/tests

      - name: Run data quality checks
        run: |
          source .venv/bin/activate
          if [ -f training/data/customers.csv ]; then
            python dq/dq_cli.py validate training/data/customers.csv --config dq/dq_rules.yaml --format json
          else
            echo "training/data/customers.csv missing; skipping DQ validation."
          fi

      - name: Dependency audit
        run: |
          source .venv/bin/activate
          if [ -f training/requirements.txt ]; then
            pip-audit -r api/requirements.txt -r training/requirements.txt --severity HIGH --severity CRITICAL || true
          else
            pip-audit -r api/requirements.txt --severity HIGH --severity CRITICAL || true
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Ensure Artifact Registry repository exists
        run: |
          if ! gcloud artifacts repositories describe "${ARTIFACT_REPO}" --location "${GCP_REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${ARTIFACT_REPO}" \
              --repository-format=docker \
              --location "${GCP_REGION}" \
              --description "Offer Ranker images"
          else
            echo "Repository ${ARTIFACT_REPO} exists in ${GCP_REGION}"
          fi

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev"

      - name: Build Docker image
        id: build-image
        run: |
          IMAGE_SHA="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/offer-ranker-api:${GITHUB_SHA}"
          IMAGE_LATEST="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/offer-ranker-api:latest"
          docker build -t "${IMAGE_SHA}" -t "${IMAGE_LATEST}" ./api
          echo "image=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          exit-code: "0"

      - name: Push image to Artifact Registry
        run: |
          docker push "${{ steps.build-image.outputs.image }}"
          docker push "${{ steps.build-image.outputs.image_latest }}"

      - name: Publish image info
        run: |
          {
            echo "Pushed images:"
            echo "- ${{ steps.build-image.outputs.image }}"
            echo "- ${{ steps.build-image.outputs.image_latest }}"
          } >> "$GITHUB_STEP_SUMMARY"
