name: Deploy

# terraform apply must only happen via this manually-triggered workflow

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override container image (defaults to latest CI image)."
        required: false
        default: ""

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  CLOUD_RUN_SERVICE_NAME: ${{ secrets.CLOUD_RUN_SERVICE_NAME }}
  ARTIFACT_REGISTRY_REPO: ${{ secrets.ARTIFACT_REGISTRY_REPO }}
  SERVICE_ACCOUNT_EMAIL: ${{ secrets.CLOUD_RUN_SERVICE_ACCOUNT }}
  IMAGE_URI: ${{ inputs.image_tag != '' && inputs.image_tag || format('%s-docker.pkg.dev/%s/%s/offer-ranker-api:%s', secrets.GCP_REGION, secrets.GCP_PROJECT_ID, secrets.ARTIFACT_REGISTRY_REPO, github.sha) }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Init
        working-directory: infrastructure
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_service_name: ${{ env.CLOUD_RUN_SERVICE_NAME }}
          TF_VAR_image: ${{ env.IMAGE_URI }}
          TF_VAR_service_account_email: ${{ env.SERVICE_ACCOUNT_EMAIL }}
        run: terraform init -input=false

      - name: Terraform Apply (manual workflow only)
        working-directory: infrastructure
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_service_name: ${{ env.CLOUD_RUN_SERVICE_NAME }}
          TF_VAR_image: ${{ env.IMAGE_URI }}
          TF_VAR_service_account_email: ${{ env.SERVICE_ACCOUNT_EMAIL }}
        run: terraform apply -input=false -auto-approve

      - name: Capture Cloud Run URL
        id: tf-output
        working-directory: infrastructure
        run: |
          URL=$(terraform output -raw cloud_run_url)
          echo "cloud_run_url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test deployment
        env:
          SMOKE_TEST_BASE_URL: ${{ steps.tf-output.outputs.cloud_run_url }}
        run: bash scripts/smoke_test.sh "$SMOKE_TEST_BASE_URL"
