name: cd-manual

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (defaults to current SHA or provided tag)"
        required: false
        default: "latest"

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCS_MODEL_BUCKET: ${{ secrets.GCS_MODEL_BUCKET }}
  SERVICE_NAME: offer-ranker-api
  ARTIFACT_REPO: offer-ranker-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Ensure Artifact Registry repository exists
        run: |
          if ! gcloud artifacts repositories describe "${ARTIFACT_REPO}" --location "${GCP_REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${ARTIFACT_REPO}" \
              --location "${GCP_REGION}" \
              --repository-format=docker \
              --description="Artifact Registry for offer-ranker-api"
          fi

      - name: Determine image to deploy
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA}"
          fi
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/offer-ranker-api:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Verify image tag exists in Artifact Registry
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          TAG: ${{ steps.image.outputs.tag }}
        run: |
          echo "Checking for tag ${TAG} in Artifact Registry..."
          if ! gcloud artifacts docker images describe "${IMAGE}" >/dev/null 2>&1; then
            echo "Image tag '${TAG}' not found in Artifact Registry ${ARTIFACT_REPO}. Run the CI workflow to build and push this tag, then retry."
            exit 1
          fi

      - id: capture-prev
        name: Capture previous image (for rollback)
        run: |
          set +e
          PREV_IMAGE=$(gcloud run services describe "${SERVICE_NAME}" --region "${GCP_REGION}" --format="value(template.spec.containers[0].image)")
          set -e
          echo "previous_image=${PREV_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        id: deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          echo "Deploying image ${IMAGE} to Cloud Run service ${SERVICE_NAME} in ${GCP_REGION}"
          if gcloud run services describe "${SERVICE_NAME}" --region "${GCP_REGION}" >/dev/null 2>&1; then
            gcloud run services update "${SERVICE_NAME}" \
              --region "${GCP_REGION}" \
              --image "${IMAGE}"
          else
            gcloud run deploy "${SERVICE_NAME}" \
              --image "${IMAGE}" \
              --region "${GCP_REGION}" \
              --platform=managed \
              --allow-unauthenticated \
              --service-account "ci-cd-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
              --concurrency=80 \
              --min-instances=0 \
              --max-instances=3 \
              --set-env-vars "ENV=dev"
          fi

      - id: service-info
        name: Capture service URL
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" --region "${GCP_REGION}" --format="value(status.url)")
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests
        id: smoke
        env:
          SERVICE_URL: ${{ steps.service-info.outputs.service_url }}
        run: |
          echo "Hitting ${SERVICE_URL}"
          health_status=$(curl -s -o /tmp/health.json -w "%{http_code}" "${SERVICE_URL}/health")
          if [[ "${health_status}" != "200" ]]; then
            echo "Health check failed with status ${health_status}"
            cat /tmp/health.json
            exit 1
          fi
          payload='{"age":30,"tenure_months":24,"monthly_spend":120.5,"num_support_tickets":2}'
          predict_status=$(curl -s -o /tmp/predict.json -w "%{http_code}" -X POST "${SERVICE_URL}/predict" -H "Content-Type: application/json" -d "${payload}")
          if [[ "${predict_status}" != "200" ]]; then
            echo "Predict check failed with status ${predict_status}"
            cat /tmp/predict.json
            exit 1
          fi
          echo "Smoke tests passed."

      - name: Roll back on failure
        if: failure() && steps.capture-prev.outputs.previous_image != ''
        env:
          PREV_IMAGE: ${{ steps.capture-prev.outputs.previous_image }}
        run: |
          echo "Rolling back to previous image ${PREV_IMAGE}"
          gcloud run services update "${SERVICE_NAME}" --region "${GCP_REGION}" --image "${PREV_IMAGE}"

      - name: Publish deployment info
        if: success()
        env:
          SERVICE_URL: ${{ steps.service-info.outputs.service_url }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          {
            echo "Deployed image: ${IMAGE}"
            echo "Service URL: ${SERVICE_URL}"
            echo
            echo "Sample commands:"
            echo "\`curl -s ${SERVICE_URL}/health\`"
            echo "curl -s -X POST ${SERVICE_URL}/predict -H 'Content-Type: application/json' -d '{\"age\":30,\"tenure_months\":24,\"monthly_spend\":120.5,\"num_support_tickets\":2}'"
          } >> "$GITHUB_STEP_SUMMARY"
          
      - name: Verify cleanup
        run: |
          {
            echo "Cleanup verification:"
            echo "Cloud Run services (should be empty):"
            gcloud run services list --project "${GCP_PROJECT_ID}" --region "${GCP_REGION}" || true
            echo
            echo "Artifact Registry repos (should be empty):"
            gcloud artifacts repositories list --project "${GCP_PROJECT_ID}" --location "${GCP_REGION}" || true
            echo
            echo "Buckets (model bucket should be gone):"
            gcloud storage ls --project "${GCP_PROJECT_ID}" || true
          } >> "$GITHUB_STEP_SUMMARY"
