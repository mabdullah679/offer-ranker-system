name: destroy

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCS_MODEL_BUCKET: ${{ secrets.GCS_MODEL_BUCKET }}
  SERVICE_NAME: offer-ranker-api
  ARTIFACT_REPO: offer-ranker-api

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Destroy Cloud Run service
        run: |
          gcloud run services delete "${SERVICE_NAME}" --region "${GCP_REGION}" --quiet || true

      - name: Delete Artifact Registry repository (images)
        run: |
          gcloud artifacts repositories delete "${ARTIFACT_REPO}" \
            --location "${GCP_REGION}" \
            --quiet || true

      - name: Delete model bucket (if present)
        run: |
          if [ -n "${GCS_MODEL_BUCKET}" ]; then
            gcloud storage rm -r "gs://${GCS_MODEL_BUCKET}" || true
          fi
