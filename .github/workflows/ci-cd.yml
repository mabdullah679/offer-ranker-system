name: ci-cd

on:
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  GCS_MODEL_BUCKET: ${{ secrets.GCS_MODEL_BUCKET }}
  SERVICE_NAME: offer-ranker-api
  ARTIFACT_REPO: offer-ranker-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      image_latest: ${{ steps.build-image.outputs.image_latest }}
    steps:
      - uses: actions/checkout@v4

      - name: Download promoted model
        uses: actions/download-artifact@v4
        with:
          name: promoted-model
          path: artifacts/promoted-model
        continue-on-error: true

      - name: Place model artifact
        run: |
          mkdir -p api/models
          JOBLIB_PATH=$(find artifacts/promoted-model -name "offer_model.joblib" -print -quit 2>/dev/null || true)
          if [ -z "${JOBLIB_PATH}" ]; then
            echo "Promoted model artifact missing. Upload an artifact named 'promoted-model' containing api/models/offer_model.joblib before rerunning."
            exit 1
          fi
          cp "${JOBLIB_PATH}" api/models/offer_model.joblib
          META_PATH=$(find artifacts/promoted-model -name "model_metadata.json" -print -quit 2>/dev/null || true)
          if [ -n "${META_PATH}" ]; then
            cp "${META_PATH}" api/models/model_metadata.json
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          if [ -f training/requirements.txt ]; then
            pip install -r training/requirements.txt
          else
            pip install pandas pyyaml
          fi
          pip install pip-audit==2.7.3

      - name: Run pytest
        run: .venv/bin/pytest api/tests

      - name: Run data quality checks
        run: |
          source .venv/bin/activate
          if [ -f training/data/customers.csv ]; then
            python dq/dq_cli.py validate training/data/customers.csv --config dq/dq_rules.yaml --format json
          else
            echo "training/data/customers.csv missing; skipping DQ validation."
          fi

      - name: Dependency audit
        run: |
          source .venv/bin/activate
          if [ -f training/requirements.txt ]; then
            pip-audit -r api/requirements.txt -r training/requirements.txt --severity HIGH --severity CRITICAL || true
          else
            pip-audit -r api/requirements.txt --severity HIGH --severity CRITICAL || true
          fi

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Ensure Artifact Registry repository exists
        run: |
          if ! gcloud artifacts repositories describe "${ARTIFACT_REPO}" --location "${GCP_REGION}" >/dev/null 2>&1; then
            gcloud artifacts repositories create "${ARTIFACT_REPO}" \
              --repository-format=docker \
              --location "${GCP_REGION}" \
              --description "Offer Ranker images"
          else
            echo "Repository ${ARTIFACT_REPO} exists in ${GCP_REGION}"
          fi

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev"

      - name: Build Docker image
        id: build-image
        run: |
          IMAGE_SHA="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/offer-ranker-api:${GITHUB_SHA}"
          IMAGE_LATEST="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPO}/offer-ranker-api:latest"
          docker build -t "${IMAGE_SHA}" -t "${IMAGE_LATEST}" ./api
          echo "image=${IMAGE_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMAGE_LATEST}" >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"
          exit-code: "0"

      - name: Push image to Artifact Registry
        run: |
          docker push "${{ steps.build-image.outputs.image }}"
          docker push "${{ steps.build-image.outputs.image_latest }}"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure deployer service account exists
        run: |
          gcloud iam service-accounts create "ci-cd-deployer" --display-name="CI/CD Deployer" || true
          gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
            --member "serviceAccount:ci-cd-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --role "roles/run.admin"
          gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
            --member "serviceAccount:ci-cd-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --role "roles/iam.serviceAccountUser"
          gcloud projects add-iam-policy-binding "${GCP_PROJECT_ID}" \
            --member "serviceAccount:ci-cd-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com" \
            --role "roles/storage.admin"

      - id: capture-prev
        name: Capture previous image (for rollback)
        run: |
          set +e
          PREV_IMAGE=$(gcloud run services describe "${SERVICE_NAME}" --region "${GCP_REGION}" --format="value(template.spec.containers[0].image)")
          set -e
          echo "previous_image=${PREV_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: api/infrastructure
        run: terraform init

      - name: Terraform apply
        working-directory: api/infrastructure
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          terraform apply -auto-approve \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="region=${GCP_REGION}" \
            -var="image=${IMAGE}" \
            -var="service_name=${SERVICE_NAME}" \
            -var="gcs_model_bucket=${GCS_MODEL_BUCKET}" \
            -var="service_account_email=ci-cd-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com"

      - id: tf-output
        name: Capture Terraform outputs
        working-directory: api/infrastructure
        run: |
          SERVICE_URL=$(terraform output -raw service_url)
          echo "service_url=${SERVICE_URL}" >> "$GITHUB_OUTPUT"

      - name: Run smoke tests
        id: smoke
        env:
          SERVICE_URL: ${{ steps.tf-output.outputs.service_url }}
        run: |
          echo "Hitting ${SERVICE_URL}"
          health_status=$(curl -s -o /tmp/health.json -w "%{http_code}" "${SERVICE_URL}/health")
          if [[ "${health_status}" != "200" ]]; then
            echo "Health check failed with status ${health_status}"
            cat /tmp/health.json
            exit 1
          fi
          payload='{"age":30,"tenure_months":24,"monthly_spend":120.5,"num_support_tickets":2}'
          predict_status=$(curl -s -o /tmp/predict.json -w "%{http_code}" -X POST "${SERVICE_URL}/predict" -H "Content-Type: application/json" -d "${payload}")
          if [[ "${predict_status}" != "200" ]]; then
            echo "Predict check failed with status ${predict_status}"
            cat /tmp/predict.json
            exit 1
          fi
          echo "Smoke tests passed."

      - name: Roll back on failure
        if: failure() && steps.capture-prev.outputs.previous_image != ''
        env:
          PREV_IMAGE: ${{ steps.capture-prev.outputs.previous_image }}
        run: |
          echo "Rolling back to previous image ${PREV_IMAGE}"
          gcloud run services update "${SERVICE_NAME}" --region "${GCP_REGION}" --image "${PREV_IMAGE}"

      - name: Publish deployment info
        if: success()
        env:
          SERVICE_URL: ${{ steps.tf-output.outputs.service_url }}
          IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          {
            echo "Deployed image: ${IMAGE}"
            echo "Service URL: ${SERVICE_URL}"
            echo
            echo "Sample commands:"
            echo "\\`curl -s ${SERVICE_URL}/health\\`"
            echo "curl -s -X POST ${SERVICE_URL}/predict -H 'Content-Type: application/json' -d '{\"age\":30,\"tenure_months\":24,\"monthly_spend\":120.5,\"num_support_tickets\":2}'"
          } >> "$GITHUB_STEP_SUMMARY"
